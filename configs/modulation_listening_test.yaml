    enableLooping: true
    reference: configs/resources/modulation_listening_test/training/training__basics__fm_fold__78_1024__freq_0.25hz_-18lufs.wav
    createAnchor35: false
    createAnchor70: false
    randomize: true
    strict: true
    mustRate: true  # This requires the user to listen to each condition at least once before continuing
    mustMoveSliders: true  # This requires the user to move each rating slider at least once before continuing
    checkReference: true  # This checks that the reference is rated between (0, 20) before letting the user proceed. This should only be used during the training page or not at all.
    checkRange: true  # This checks that the lowest rating is between (0, 20) and the highest rating is between (80, 100) before letting the user proceed. This should only be used during the training page or not at all.
    showConditionNames: false
